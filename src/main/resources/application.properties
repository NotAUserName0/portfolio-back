spring.application.name=porfolio
server.port=8081
spring.application.version=1.0.0

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:8080/portfolio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:springRoot}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Admin data
admin.default.username=${ADMIN_DEFAULT_USERNAME:admin}
admin.default.password=${ADMIN_DEFAULT_PASSWORD:12345}
# JWT
admin.default.secretKey=${ADMIN_DEFAULT_SECRET:secretkey2026AdminSettedABCDEFGHIJKLMOPQRSTUVWXYZ}
# 1hr by default
admin.default.expiration=${ADMIN_DEFAULT_EXPIRATION:3600000}
# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# Directory for file uploads
file.upload-dir=${UPLOAD_DIR:upload/}

# Security & DDoS Mitigation: Rate limiting configuration
# Maximum requests allowed per IP window on sensitive endpoints (/auth)
security.rate-limit.auth.max-requests=${RATE_LIMIT_AUTH_MAX:10}
# Time window in seconds for the rate limiting counter
security.rate-limit.auth.window-seconds=${RATE_LIMIT_AUTH_WINDOW:60}

# Server connection timeouts to protect against Slowloris DoS attacks
server.tomcat.connection-timeout=5000
server.tomcat.keep-alive-timeout=15000

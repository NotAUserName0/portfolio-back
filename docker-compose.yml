services:
  portfolio-api:
    build: .
    container_name: portfolio-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./upload:/app/upload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://host.docker.internal:3306/portfolio
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - ADMIN_DEFAULT_USERNAME=admin
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_DEFAULT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://72.60.30.86:5000